<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
      #player-container iframe { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; }
    </style>
    <title>WHAT THE BEATS Player</title>
  </head>
  <body>
    <!-- apps0263-whatthebeats 전용 유튜브 IFrame 임베드 페이지(다른 앱과 공유 금지).
         구조는 apps0221 player.html 과 동일: 진짜 https 오리진 + 생성자에 videoId 직접 + onReady 전 호출 큐. -->
    <div id="player-container"><div id="player"></div></div>
    <script>
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
      var player, timer, playerReady = false, pending = [];
      var first = (location.search.match(/[?&]v=([\w-]{11})/) || [])[1] || 'dQw4w9WgXcQ';
      function post(type, data) { try { WtbChannel.postMessage(JSON.stringify({ type: type, data: data })); } catch (e) {} }
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          host: 'https://www.youtube.com',
          videoId: first,
          playerVars: { controls: 0, modestbranding: 1, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0,
                        playsinline: 1, cc_load_policy: 0, enablejsapi: 1, origin: 'https://dksequence.com' },
          events: {
            onReady: function () {
              playerReady = true;
              var q = pending; pending = [];
              q.forEach(function (fn) { try { fn(); } catch (e) {} });
              post('ready', null);
            },
            onStateChange: function (e) {
              post('stateChange', e.data);
              try { var vd = player.getVideoData(); if (vd && vd.video_id && (e.data === 1 || e.data === 3)) post('video', vd.video_id); } catch (x) {}
              clearInterval(timer);
              if (e.data === 1) timer = setInterval(function () { post('time', player.getCurrentTime()); }, 500);
            },
            onError: function (e) { post('error', e.data); }
          }
        });
      }
      window.onresize = function () { if (player && player.setSize) player.setSize(window.innerWidth, window.innerHeight); };
    </script>
  </body>
</html>
