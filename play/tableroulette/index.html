<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tableroulette — DKsequence</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 120% at 50% 0%,#15151d 0%,#08080c 70%);
     display:flex;align-items:center;justify-content:center;padding:20px;
     font-family:Arial,"Malgun Gothic",sans-serif}
.phone{position:relative;width:390px;height:844px;max-height:94vh;
       aspect-ratio:390/844;background:#000;border:12px solid #16161d;
       border-radius:46px;overflow:hidden;
       box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05) inset}
.phone iframe{width:100%;height:100%;border:0;display:block;background:#000}
@media (max-width:520px){
  body{background:#000;padding:0}
  .phone{width:100vw;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0}
}
</style>
</head>
<body>
  <div class="phone"><iframe src="g/" title="game" allow="autoplay; fullscreen"></iframe></div>
</body>
</html>
